<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PROTOTYPE · nav and root · platform#83</title>

  <!-- PROTOTYPE — throwaway route for platform#83. Not a build entry in
       vite.config.js, so it exists under `npm run dev` and ships nowhere.
       Three variants of the navigation bar and of the root directory page,
       over a faked Manifest carrying several Leagues and several years. -->

  <!-- Bootstrap 5.3, as every real page loads it -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- The site's own stylesheet, so the bar is judged against real tokens -->
  <link href="/src/site.css" rel="stylesheet">
  <link href="/src/prototype-nav/prototype.css" rel="stylesheet">

  <script>
    (function () {
      var saved = localStorage.getItem('mbTheme') || 'dark';
      document.documentElement.setAttribute('data-bs-theme', saved);
    })();
  </script>
</head>

<body>

<div id="page"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/src/prototype-nav/main.js"></script>
</body>
</html>
