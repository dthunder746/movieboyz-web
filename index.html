<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MovieBoyz</title>

    <!-- Site styles. The redirect barely uses them; it links the sheet so
         that a second entry names the same asset, which is what keeps the
         build honest about emitting one stylesheet for the whole site. -->
    <link href="/src/site.css" rel="stylesheet">

    <style>
      /* The root only ever shows for the moment it takes to read the manifest,
         or when that read fails. Anything more would be styling a redirect. */
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem auto;
        max-width: 40rem;
        padding: 0 1rem;
      }
      .error { color: #b00; }
    </style>
  </head>
  <body>
    <main id="app">
      <h1>MovieBoyz</h1>
      <p>Opening the current campaign.</p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
