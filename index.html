<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MovieBoyz</title>

  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Site styles -->
  <link href="/src/site.css" rel="stylesheet">

  <!-- Restore theme before first paint to avoid flash -->
  <script>
    (function () {
      var saved = localStorage.getItem('mbTheme') || 'dark';
      document.documentElement.setAttribute('data-bs-theme', saved);
    })();
  </script>
</head>

<body>

<!-- The root is a directory of everything the site holds, not a redirect
     (#84). It carries the brand and the theme switch and no navigation bar:
     the page is the navigation opened out, and the collapsed menu above it
     would say the same thing twice (#81).

     The markup sits here rather than in a module because one file needs it,
     as the Movies page's does. Both sections are filled in by `src/root/page.js`
     once the Manifest lands, and the Movies section is drawn even when it does
     not, because the lookup reads no League file.

     No Bootstrap JS: there is no menu on this page to open. -->

<!-- ── Header ─────────────────────────────────────────────────────────── -->
<nav class="navbar navbar-expand-sm mb-3 border-bottom">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" id="site-brand">🎬 MBZ</a>
    <div class="d-flex flex-wrap align-items-center gap-3 ms-auto">
      <div class="form-check form-switch mb-0">
        <input class="form-check-input" type="checkbox" id="themeSwitch">
        <label class="form-check-label" for="themeSwitch">Light</label>
      </div>
    </div>
  </div>
</nav>

<!-- ── Main ───────────────────────────────────────────────────────────── -->
<div class="container-fluid px-3">

  <section class="site-directory" aria-labelledby="leagues-heading">
    <h2 id="leagues-heading" class="site-directory-heading">Leagues</h2>
    <div id="directory-leagues">
      <p class="site-directory-note">Reading the published leagues.</p>
    </div>
  </section>

  <section class="site-directory" aria-labelledby="movies-heading">
    <h2 id="movies-heading" class="site-directory-heading">Movies</h2>
    <div id="directory-movies"></div>
  </section>

</div>

<!-- ── Scripts ────────────────────────────────────────────────────────── -->
<script type="module" src="/src/root/page.js"></script>
</body>
</html>
