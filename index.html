<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MovieBoyz</title>

  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Site styles -->
  <link href="/src/site.css" rel="stylesheet">

  <!-- Restore theme before first paint to avoid flash -->
  <script>
    (function () {
      var saved = localStorage.getItem('mbTheme') || 'dark';
      document.documentElement.setAttribute('data-bs-theme', saved);
    })();
  </script>
</head>

<body>

<!-- The root is a directory of everything the site holds, not a redirect
     (#84). It carries the brand and the theme switch and no navigation bar:
     the page is the navigation opened out, and the collapsed menu above it
     would say the same thing twice (#81). The brand is the page's own heading
     rather than a bar with nothing in it, which is what the first cut drew
     and what the operator sent back.

     Movies comes first because it belongs to no League. The Leagues section
     and each League inside it fold, on native <details>: the page loads no
     Bootstrap JS, and there is no menu to open, so nothing else is needed.

     The markup sits here rather than in a module because one file needs it,
     as the Movies page's does. The Leagues section is filled in by
     `src/root/page.js` once the Manifest lands, and the Movies section is
     drawn regardless, because the lookup reads no League file. -->

<div class="site-root">

  <div class="form-check form-switch mb-0 site-root-switch">
    <input class="form-check-input" type="checkbox" id="themeSwitch">
    <label class="form-check-label" for="themeSwitch">Light</label>
  </div>

  <!-- ── Header ─────────────────────────────────────────────────────────── -->
  <header class="site-root-head">
    <a class="site-root-brand" id="site-brand">🎬 MBZ</a>
    <p class="site-root-lede">Fantasy box office. Every league and every year the platform holds.</p>
  </header>

  <!-- ── Main ───────────────────────────────────────────────────────────── -->
  <section class="site-directory" aria-labelledby="movies-heading">
    <h2 id="movies-heading" class="site-directory-heading">Movies</h2>
    <div class="site-directory-panel" id="directory-movies"></div>
  </section>

  <details class="site-directory" open>
    <summary class="site-directory-summary">
      <h2 id="leagues-heading" class="site-directory-heading">Leagues</h2>
      <svg class="site-directory-chevron" aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </summary>
    <div class="site-directory-panels" id="directory-leagues">
      <div class="site-directory-panel">
        <p class="site-directory-note">Reading the published leagues.</p>
      </div>
    </div>
  </details>

</div>

<!-- ── Scripts ────────────────────────────────────────────────────────── -->
<script type="module" src="/src/root/page.js"></script>
</body>
</html>
