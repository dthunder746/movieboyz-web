<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MovieBoyz Fantasy Box Office</title>

  <!-- This file is served for a path the host has no file for, so it is read
       from the site root while the address bar says something else entirely.
       Every relative URL below would resolve against that address, so point
       <base> back at the root before anything else is parsed. It cannot use
       `siteRoot` from `src/shared/route.js`, which says the same thing in the
       same way: this has to run before the module graph is even addressable,
       since the module's own URL is one of the ones being fixed.

       So it is a copy, and it has to answer as `siteRoot` does. It locates the
       same two markers in the same order, accepts the league marker on the
       strength of the slug behind it rather than of a year (a League landing
       page has no year, and a mistyped Campaign path still says where the site
       starts), and takes the last marker rather than the first for the same
       reason: the prefix is somebody else's naming and can repeat it. The
       `<base>` it writes is then what the navigation reads back, so the root is
       worked out here once rather than derived a second time from a path that
       names nothing reliable. -->
  <script>
    (function () {
      var segments = window.location.pathname.split('/').filter(Boolean);
      if (segments.length && segments[segments.length - 1].indexOf('.') !== -1) segments.pop();

      var root = '/';
      var league = segments.lastIndexOf('league');
      var movies = segments.lastIndexOf('movies');

      if (league !== -1 && segments[league + 1]) {
        root = league > 0 ? '/' + segments.slice(0, league).join('/') + '/' : '/';
      } else if (movies !== -1) {
        root = movies > 0 ? '/' + segments.slice(0, movies).join('/') + '/' : '/';
      }

      document.write('<base href="' + root + '">');
    })();
  </script>

  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Tabulator Bootstrap5 theme -->
  <link href="https://unpkg.com/tabulator-tables@6.3.0/dist/css/tabulator_bootstrap5.min.css" rel="stylesheet">

  <!-- Site styles -->
  <link href="/src/site.css" rel="stylesheet">

  <!-- Restore theme before first paint to avoid flash -->
  <script>
    (function () {
      var saved = localStorage.getItem('mbTheme') || 'dark';
      document.documentElement.setAttribute('data-bs-theme', saved);
    })();
  </script>
</head>

<body>

<!-- Replaced as soon as the entry module runs. It is what a reader sees if the
     assets could not be reached at all, which is the one case that cannot be
     answered in JavaScript. -->
<div id="page">
  <div class="container-fluid px-3 py-4">
    <h1>MovieBoyz</h1>
    <p>There is nothing published at this address.</p>
  </div>
</div>

<!-- ── Scripts ────────────────────────────────────────────────────────── -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/tabulator-tables@6.3.0/dist/js/tabulator.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
<script type="module" src="/src/catchall/entry.js"></script>
</body>
</html>
