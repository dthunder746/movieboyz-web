<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movie · MovieBoyz</title>

  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Site styles -->
  <link href="/src/site.css" rel="stylesheet">

  <!-- Restore theme before first paint to avoid flash -->
  <script>
    (function () {
      var saved = localStorage.getItem('mbTheme') || 'dark';
      document.documentElement.setAttribute('data-bs-theme', saved);
    })();
  </script>
</head>

<body>

<!-- Everything the page renders sits inside `#page`, including the navigation,
     because `shared/notice.js` takes the whole of it over for the two cases
     this page has no Movie to show: an address naming no Movie, and one naming
     a Movie no slice carries. -->
<div id="page">

<!-- ── Header ─────────────────────────────────────────────────────────── -->
<nav class="navbar navbar-expand-sm mb-3 border-bottom">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" id="site-brand">🎬 MovieBoyz</a>
    <div id="site-nav" class="site-nav"></div>
    <div class="d-flex flex-wrap align-items-center gap-3 ms-auto">
      <div class="form-check form-switch mb-0">
        <input class="form-check-input" type="checkbox" id="themeSwitch">
        <label class="form-check-label" for="themeSwitch">Light</label>
      </div>
    </div>
  </div>
</nav>

<!-- ── Main ───────────────────────────────────────────────────────────── -->
<div class="container-fluid px-3">

  <div id="movie-header"></div>

  <div id="slice-notice" class="alert alert-warning py-2 px-3 d-none" role="status"></div>

  <div id="movie-facts" class="movie-facts mb-4"></div>

  <!-- Chart -->
  <div class="chart-card mb-4">
    <div class="chart-card-header">
      <h6 class="text-uppercase text-muted fw-semibold mb-0" style="letter-spacing:.08em">Box Office</h6>
      <button id="reset-zoom" class="btn btn-sm btn-outline-secondary">Reset zoom</button>
    </div>
    <div id="chart-wrapper">
      <canvas id="movieChart"></canvas>
    </div>
    <p id="chart-blank" class="chart-blank d-none"></p>
    <p id="chart-note" class="chart-note d-none" role="status"></p>
  </div>

  <div id="movie-ratings" class="mb-4"></div>

  <div id="movie-holdings" class="mb-4"></div>

</div>

<!-- ── Footer ─────────────────────────────────────────────────────────── -->
<div class="container-fluid px-3 mt-3 pb-3 border-top pt-2">
  <small class="text-muted d-block" id="data-updated"></small>
</div>

</div>

<!-- ── Scripts ────────────────────────────────────────────────────────── -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
<script type="module" src="/src/movies/movie/page.js"></script>
</body>
</html>
