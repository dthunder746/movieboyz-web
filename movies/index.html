<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movies · MovieBoyz</title>

  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Tabulator Bootstrap5 theme -->
  <link href="https://unpkg.com/tabulator-tables@6.3.0/dist/css/tabulator_bootstrap5.min.css" rel="stylesheet">

  <!-- Site styles -->
  <link href="/src/site.css" rel="stylesheet">

  <!-- Restore theme before first paint to avoid flash -->
  <script>
    (function () {
      var saved = localStorage.getItem('mbTheme') || 'dark';
      document.documentElement.setAttribute('data-bs-theme', saved);
    })();
  </script>
</head>

<body>

<!-- ── Header ─────────────────────────────────────────────────────────── -->
<nav class="navbar navbar-expand-sm mb-3 border-bottom">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" id="site-brand">🎬 MovieBoyz</a>
    <div id="site-nav" class="site-nav"></div>
    <div class="d-flex flex-wrap align-items-center gap-3 ms-auto">
      <div class="form-check form-switch mb-0">
        <input class="form-check-input" type="checkbox" id="themeSwitch">
        <label class="form-check-label" for="themeSwitch">Light</label>
      </div>
    </div>
  </div>
</nav>

<!-- ── Main ───────────────────────────────────────────────────────────── -->
<div class="container-fluid px-3">

  <h1 class="movies-title">Movies</h1>
  <p class="movies-lede text-muted">Every Movie the platform tracks, whoever picked it and whether anybody did.</p>

  <div id="slice-notice" class="alert alert-warning py-2 px-3 d-none" role="status"></div>

  <!-- Chart -->
  <div class="chart-card mb-4" id="chart-card">
    <div class="chart-card-header">
      <h6 id="chart-heading" class="text-uppercase text-muted fw-semibold mb-0" style="letter-spacing:.08em">Box Office</h6>
      <div class="d-flex align-items-center gap-2">
        <label class="text-muted" for="window-select" style="font-size:0.78rem">Window</label>
        <select id="window-select" class="form-select form-select-sm" style="width:auto" aria-label="Days since release window">
          <option value="30">30 days</option>
          <option value="60">60 days</option>
          <option value="90">90 days</option>
          <option value="180">180 days</option>
          <option value="365">365 days</option>
        </select>
        <button id="reset-zoom" class="btn btn-sm btn-outline-secondary">Reset zoom</button>
        <button id="chart-toggle" class="btn btn-sm btn-outline-secondary" type="button" aria-expanded="true" aria-controls="chart-body">Hide chart</button>
      </div>
    </div>
    <div id="chart-body">
      <div id="chart-wrapper">
        <canvas id="grossChart"></canvas>
      </div>
      <p id="chart-blank" class="chart-blank d-none"></p>
      <p id="chart-note" class="chart-note d-none" role="status"></p>
    </div>
  </div>

  <!-- Movie table -->
  <div id="table-wrapper">
    <div id="toolbar" class="d-flex align-items-center gap-2 mb-2 flex-wrap">
      <input type="search" id="movies-search" class="form-control form-control-sm" style="max-width:260px" placeholder="Search by title…" aria-label="Search by title">
      <div class="dropdown" id="sort-dropdown">
        <button id="sort-toggle" class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">Sort</button>
        <ul class="dropdown-menu" id="sort-menu">
          <li><button class="dropdown-item" type="button" data-sort="gross_desc">Gross &darr; (highest)</button></li>
          <li><button class="dropdown-item" type="button" data-sort="gross_asc">Gross &uarr; (lowest)</button></li>
          <li><hr class="dropdown-divider"></li>
          <li><button class="dropdown-item" type="button" data-sort="release_desc">Released &darr; (newest)</button></li>
          <li><button class="dropdown-item" type="button" data-sort="release_asc">Released &uarr; (oldest)</button></li>
          <li><hr class="dropdown-divider"></li>
          <li><button class="dropdown-item" type="button" data-sort="budget_desc">Budget &darr; (highest)</button></li>
          <li><button class="dropdown-item" type="button" data-sort="budget_asc">Budget &uarr; (lowest)</button></li>
          <li><hr class="dropdown-divider"></li>
          <li><button class="dropdown-item" type="button" data-sort="rating_desc">Letterboxd &darr; (highest)</button></li>
          <li><button class="dropdown-item" type="button" data-sort="rating_asc">Letterboxd &uarr; (lowest)</button></li>
        </ul>
      </div>
      <button id="clear-movie-selection" class="btn btn-sm btn-outline-secondary" type="button" aria-label="Clear chart selection" disabled>
        <svg class="clear-icon" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        <span class="clear-label">Clear selection</span>
      </button>
      <span id="row-count" class="text-muted ms-auto" style="font-size:0.8rem"></span>
    </div>

    <div class="filter-row mb-2">
      <span class="filter-label">Release year</span>
      <div id="year-chips" class="filter-chips-toggle"></div>
    </div>

    <div class="filter-row mb-2">
      <span class="filter-label">Season</span>
      <div id="season-chips" class="filter-chips-toggle"></div>
    </div>

    <div id="table-surface">
      <div id="movie-table"></div>
    </div>
    <p id="budget-footnote">≈ marks a budget upstream estimated rather than reported.</p>
  </div>

</div>

<!-- ── Footer ─────────────────────────────────────────────────────────── -->
<div class="container-fluid px-3 mt-3 pb-3 border-top pt-2">
  <small class="text-muted d-block" id="data-updated"></small>
</div>

<!-- ── Scripts ────────────────────────────────────────────────────────── -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/tabulator-tables@6.3.0/dist/js/tabulator.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
<script type="module" src="/src/movies/page.js"></script>
</body>
</html>
