<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MovieBoyz</title>

  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Site styles -->
  <link href="/src/site.css" rel="stylesheet">

  <!-- Restore theme before first paint to avoid flash -->
  <script>
    (function () {
      var saved = localStorage.getItem('mbTheme') || 'dark';
      document.documentElement.setAttribute('data-bs-theme', saved);
    })();
  </script>
</head>

<body>

<!-- A shell around a single div, the way both Campaign files are. The markup
     lives in `src/league/layout.js` because this file is per League and that
     markup is not: a second published League is a copy of these few lines and
     nothing else, and the page reads which League it is showing off its own URL.

     No Tabulator and no Chart.js. This page is two tables and a set of cards,
     and the CDN tags a page does not load are the ones it does not wait for. -->
<div id="page">
  <div class="container-fluid px-3 py-4">
    <h1>MovieBoyz</h1>
    <p>Loading the league.</p>
  </div>
</div>

<!-- ── Scripts ────────────────────────────────────────────────────────── -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/src/league/entry.js"></script>
</body>
</html>
