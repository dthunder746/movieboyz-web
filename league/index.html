<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MovieBoyz</title>

  <!-- `/league/` is the segment the Leagues hang under, not an address of its
       own: nothing is published at it, and before this it answered the
       catch-all's "not found" notice, which reads as a fault rather than as
       the truth, that the reader wants the directory one level up (#187).

       A meta refresh rather than a script, so the hop happens whether or not
       the page runs JavaScript, and rather than a host redirect, because Pages
       serves files and has no rewrite rules (ADR 0010). The link below is the
       fallback for a reader whose browser honours neither.

       The target is written absolute. The site serves from its own domain,
       where the root is `/`, and a relative hop from here would have to count
       segments the way the rest of the site's links refuse to. -->
  <meta http-equiv="refresh" content="0; url=/">

  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Site styles -->
  <link href="/src/site.css" rel="stylesheet">

  <!-- Restore theme before first paint to avoid flash -->
  <script>
    (function () {
      var saved = localStorage.getItem('mbTheme') || 'dark';
      document.documentElement.setAttribute('data-bs-theme', saved);
    })();
  </script>
</head>

<body>

<div class="container-fluid px-3 py-4">
  <p>The Leagues are listed on the <a href="/">MovieBoyz home page</a>.</p>
</div>

</body>
</html>
